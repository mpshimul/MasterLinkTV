name: Update Channel List

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allow manual trigger
  push:
    paths:
      - 'scripts/process_m3u.py'
      - '.github/workflows/update-channels.yml'

permissions:
  contents: write  # This is crucial for pushing changes

jobs:
  update-channels:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Process M3U file
      run: |
        python scripts/process_m3u.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if there are changes to commit
        git add ch3.js
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🔄 Update channel list $(date +'%Y-%m-%d %H:%M UTC')"
          git push
        fi