name: Test Parser
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Create test file
      run: |
        echo "#EXTM3U" > test.m3u
        echo "#EXTINF:-1 tvg-logo=\"https://example.com/logo1.png\" group-title=\"News\",BBC News HD" >> test.m3u
        echo "http://example.com/bbc.m3u8" >> test.m3u
        echo "#EXTINF:-1 tvg-logo=\"https://example.com/logo2.png\" group-title=\"News\",CNN International" >> test.m3u
        echo "http://example.com/cnn.m3u8" >> test.m3u
    
    - name: Run parser test
      run: |
        echo "=== Testing parser ==="
        php -r "
        require_once '.github/scripts/M3UParser.php';
        \$parser = new M3UParser();
        \$result = \$parser->parse(file_get_contents('test.m3u'), 'test.m3u');
        echo 'Channels found: ' . count(\$result['channels']) . PHP_EOL;
        echo 'First channel: ' . (\$result['channels'][0]['name'] ?? 'none') . PHP_EOL;
        echo 'First group: ' . (\$result['channels'][0]['group'] ?? 'none') . PHP_EOL;
        "
