name: Test Parser
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Test parser with inline PHP
      run: |
        echo "=== Creating test M3U file ==="
        
        cat > test.m3u << 'EOF'
#EXTM3U
#EXTINF:-1 tvg-logo="https://example.com/logo1.png" group-title="News",BBC News HD
http://example.com/bbc.m3u8
#EXTINF:-1 tvg-logo="https://example.com/logo2.png" group-title="News",CNN International
http://example.com/cnn.m3u8
#EXTINF:-1 tvg-logo="https://example.com/logo3.png" group-title="Sports",ESPN
http://example.com/espn.m3u8
#EXTINF:-1 tvg-logo="https://example.com/logo4.png" group-title="Sports",Fox Sports
http://example.com/fox.m3u8
EOF
        
        echo "=== Testing parser ==="
        
        # Create a simple test script
        cat > test_parser.php << 'PHP'
<?php
require_once '.github/scripts/M3UParser.php';
\$parser = new M3UParser();
\$content = file_get_contents('test.m3u');
\$result = \$parser->parse(\$content, 'test.m3u');

echo "Channels: " . count(\$result['channels']) . "\\n";
echo "First channel: " . (\$result['channels'][0]['name'] ?? 'none') . "\\n";
echo "First channel group: " . (\$result['channels'][0]['group'] ?? 'none') . "\\n";

// Count groups
\$groups = [];
foreach (\$result['channels'] as \$ch) {
    \$group = \$ch['group'] ?? 'Uncategorized';
    \$groups[\$group] = (\$groups[\$group] ?? 0) + 1;
}

echo "Groups found: " . count(\$groups) . "\\n";
foreach (\$groups as \$g => \$c) {
    echo "  - \$g: \$c channels\\n";
}
?>
PHP
        
        php test_parser.php
