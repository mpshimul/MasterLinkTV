name: Fetch Only BD.m3u

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  fetch-bd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Fetch ONLY BD.m3u
      run: |
        echo "=== Fetching ONLY BD.m3u ==="
        
        SOURCE_URL="https://raw.githubusercontent.com/abusaeeidx/IPTV-Scraper-Zilla/main/BD.m3u"
        
        # Create directory
        mkdir -p raw_m3u
        
        # Delete any existing files
        rm -f raw_m3u/*.m3u
        
        # Fetch ONLY BD.m3u
        curl -s -o "raw_m3u/BD.m3u" "$SOURCE_URL"
        
        # Verify
        if [ -s "raw_m3u/BD.m3u" ]; then
          SIZE=$(wc -c < "raw_m3u/BD.m3u")
          COUNT=$(grep -c "#EXTINF:" "raw_m3u/BD.m3u" || echo "0")
          echo "✅ Fetched BD.m3u: $COUNT channels ($SIZE bytes)"
          echo "::set-output name=channel_count::$COUNT"
        else
          echo "❌ Failed to fetch BD.m3u"
          exit 1
        fi
    
    - name: Process BD.m3u
      run: |
        echo "=== Processing BD.m3u ==="
        php .github/scripts/process-m3u.php
        
        # Show summary
        if [ -f "processed/summary.json" ]; then
          echo "Summary:"
          cat processed/summary.json
        fi
    
    - name: Commit
      run: |
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add processed/
        
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "📺 Update BD.m3u channels"
          git push
        fi
