name: Process M3U to JSON

on:
  push:
    paths:
      - 'raw_m3u/*.m3u'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
    
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Run processor
      run: php .github/scripts/process-m3u.php
    
    - name: Commit changes
      run: |
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add processed/
        if git diff --cached --quiet; then
          echo "No changes"
        else
          git commit -m "Update processed files"
          git push
        fi
