name: Hourly IPTV Auto-Updater

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at minute 0 (UTC)
  workflow_dispatch:     # Allow manual run

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and clean M3U
        run: |
          python clean_m3u.py "https://raw.githubusercontent.com/abusaeeidx/Mrgify-BDIX-IPTV/refs/heads/main/playlist.m3u"

      - name: Convert to JavaScript
        run: python m3u_to_js.py playlist.m3u channels.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'IPTV Bot'
          git config --global user.email 'bot@example.com'
          git add playlist.m3u ch.js
          git diff --staged --quiet || (git commit -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M UTC')" && git push)
