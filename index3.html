};

// Performance monitoring
const Performance = {
    timers: {},
    
    start: function(name) {
        this.timers[name] = performance.now();
    },
    
    end: function(name) {
        if (this.timers[name]) {
            const duration = performance.now() - this.timers[name];
            console.log(`⏱️ ${name}: ${duration.toFixed(2)}ms`);
            delete this.timers[name];
            return duration;
        }
        return 0;
    }
};

// ============================================
// INITIAL LOADING MANAGER

const InitialLoader = {
    progress: 0,
    totalSteps: 3, // Shaka + HLS.js + Setup
    
    updateProgress(step, message) {
        this.progress = Math.min(100, (step / this.totalSteps) * 100);
        
        if (UI.initProgressBar) {
            UI.initProgressBar.style.width = `${this.progress}%`;
        }
        
        if (UI.initStatus) {
            UI.initStatus.textContent = message;
        }
        
        console.log(`📊 Initial load: ${this.progress.toFixed(0)}% - ${message}`);
    },
    
    complete() {
        this.updateProgress(this.totalSteps, 'Ready!');
        
        // Hide initial loading screen
        setTimeout(() => {
            if (UI.initLoading) {
                UI.initLoading.style.display = 'none';
            }
            startApp();
        }, 500);

};

// ============================================
// SHAKA PLAYER LOADER
// ============================================
const ShakaLoader = {
    loaded: false,
    loading: false,
    queue: [],
    version: '4.7.3',
    
    async load() {
        if (this.loaded) return true;
        if (this.loading) return new Promise(resolve => this.queue.push(resolve));
        
        this.loading = true;
        InitialLoader.updateProgress(0.5, 'Loading Shaka Player...');
        
        return new Promise((resolve) => {
            const script = document.createElement('script');
            script.src = `https://cdn.jsdelivr.net/npm/shaka-player@${this.version}/dist/shaka-player.compiled.js`;
            script.crossOrigin = 'anonymous';
            
            script.onload = () => {
                this.loaded = true;
                this.loading = false;
                console.log('✅ Shaka Player loaded');
                InitialLoader.updateProgress(1, 'Shaka loaded, loading HLS.js...');
                resolve(true);
                
                while (this.queue.length) {
                    this.queue.shift()(true);
                }
            };
            
            script.onerror = () => {
                console.warn('❌ Shaka Player load failed');
                this.loading = false;
                InitialLoader.updateProgress(1, 'Shaka failed, continuing...');
                resolve(false);
            };
            
            document.head.appendChild(script);
        });
    },
    
    async ensureLoaded() {
        return this.load();
    },
    
    isSupported() {
        if (!this.loaded) return false;
        return shaka.Player.isBrowserSupported();
    }
};

let shakaPlayerInstance = null;

async function initShakaPlayer(videoElement) {
    if (!CONFIG.USE_SHAKA_AS_PRIMARY) return null;
    
    await ShakaLoader.ensureLoaded();
    if (!ShakaLoader.isSupported()) {
        console.warn('Shaka not supported in this browser');
        return null;
    }
    
    if (shakaPlayerInstance) {
        try {
            await shakaPlayerInstance.destroy();
        } catch (e) {}
        shakaPlayerInstance = null;
    }
    
    try {
        Performance.start('ShakaInit');
        
        shakaPlayerInstance = new shaka.Player(videoElement);
        
        shakaPlayerInstance.configure({
            streaming: {
                bufferingGoal: CONFIG.BUFFER_GOAL,
                rebufferingGoal: CONFIG.MIN_BUFFER,
                bufferBehind: CONFIG.MAX_BUFFER,
                retryParameters: {
                    maxAttempts: 2,
                    baseDelay: 1000,
                    backoffFactor: 2,
                    timeout: 10000
                },
                lowLatencyMode: true
            },
            abr: {
                enabled: true,
                defaultBandwidthEstimate: 500000,
                restrictions: {
                    minWidth: 240,
                    minHeight: 135,
                    maxWidth: 1920,
                    maxHeight: 1080
                }
            }
        });
        
        shakaPlayerInstance.addEventListener('error', (event) => {
            console.error('Shaka error:', event.detail);
        });
        
        console.log('✅ Shaka initialized');
        Performance.end('ShakaInit');
        return shakaPlayerInstance;
        
    } catch (error) {
        console.error('Shaka initialization failed:', error);
        return null;
    }
}

                this.loading = false;
                InitialLoader.updateProgress(2, 'HLS.js failed, continuing...');
                resolve(false);
            };
            
            document.head.appendChild(script);
        });
    },
    
    async ensureLoaded() {
        return this.load();
    },
    
    isSupported() {
        if (!this.loaded) return false;
        return Hls.isSupported();
    }
};

let hlsPlayerInstance = null;

// ============================================
// UPDATED PLAYER DETECTION
// ============================================
function detectBestPlayerForStream(url) {
    if (!url) return 'iframe';
    
    const lowerUrl = url.toLowerCase();
    
    // Check if it's HLS (.m3u8)
    if (lowerUrl.includes('.m3u8')) {
        // For m3u8: Try Shaka first, then HLS.js
        if (CONFIG.USE_SHAKA_AS_PRIMARY && ShakaLoader.loaded) {
            return 'shaka';
        } else if (CONFIG.USE_HLSJS_AS_FALLBACK && HlsJsLoader.loaded) {
            return 'hlsjs';
        }
        return 'iframe';
    }
    
    // Check if it's MPEG-DASH (.mpd)
    if (lowerUrl.includes('.mpd')) {
        if (CONFIG.USE_SHAKA_AS_PRIMARY && ShakaLoader.loaded) {
            return 'shaka';
        }
        return 'iframe';
    }
    
    // For all other URLs (including .php, .html, etc.) - USE IFRAME
    return 'iframe';
}

async function initHlsJsPlayer(videoElement, streamUrl, channel) {
    if (!CONFIG.USE_HLSJS_AS_FALLBACK) return null;
    
    await HlsJsLoader.ensureLoaded();
    if (!HlsJsLoader.isSupported()) {
        console.warn('HLS.js not supported in this browser');
        return null;
    }
    
    if (hlsPlayerInstance) {
        try {
            hlsPlayerInstance.destroy();
        } catch (e) {}
        hlsPlayerInstance = null;
    }
    
    try {
        Performance.start('HlsJsInit');
        
        hlsPlayerInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 90,
            maxBufferLength: 30,
            maxBufferSize: 60 * 1000 * 1000,
            maxBufferHole: 0.5,
            maxSeekHole: 2,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 2,
            levelLoadingTimeOut: 10000,
            levelLoadingMaxRetry: 2,
            fragLoadingTimeOut: 20000,
            fragLoadingMaxRetry: 3,
            capLevelToPlayerSize: true,
            startLevel: -1,
            testBandwidth: true
        });
        
        hlsPlayerInstance.on(Hls.Events.ERROR, (event, data) => {
            console.error('HLS.js Error:', data);
            
            if (data.fatal) {
                switch(data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        console.error('HLS.js Network Error');
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        console.error('HLS.js Media Error');
                        hlsPlayerInstance.recoverMediaError();
                        break;
                    default:
                        console.error('HLS.js Fatal Error');
                        hlsPlayerInstance.destroy();
                        hlsPlayerInstance = null;
                        break;
                }
            }
        });
        
        hlsPlayerInstance.loadSource(streamUrl);
        hlsPlayerInstance.attachMedia(videoElement);
        
        console.log('✅ HLS.js initialized');
        Performance.end('HlsJsInit');
        return hlsPlayerInstance;
        
    } catch (error) {
        console.error('HLS.js initialization failed:', error);
        return null;
    }
}

// ============================================
// PLAYER MANAGEMENT - SIMPLIFIED
// ============================================
const PlayerManager = {
    async loadStream(videoElement, streamUrl, channel, listType) {
        console.log(`🎬 Loading ${channel.name} from ${listType}`);
        
        // Detect which player to use based on URL
        const playerType = detectBestPlayerForStream(streamUrl);
        console.log(`🔍 Detected player type: ${playerType.toUpperCase()} for URL: ${streamUrl.substring(0, 50)}...`);
        
        // Try the detected player
        switch(playerType) {
            case 'shaka':
                return await this.tryShakaPlayer(videoElement, streamUrl, channel);
            case 'hlsjs':
                return await this.tryHlsJsPlayer(videoElement, streamUrl, channel);
            case 'iframe':
                return await this.useIframe(streamUrl, channel);
            default:
                // Fallback to iframe for everything else
                return await this.useIframe(streamUrl, channel);
        }
    },
    
    async tryShakaPlayer(videoElement, streamUrl, channel) {
        Performance.start('ShakaTry');
        
        try {
            const player = await initShakaPlayer(videoElement);
            if (!player) {
                throw new Error('Shaka init failed');
            }
            
            if (UI.frame) {
                UI.frame.style.display = 'none';
                UI.frame.src = 'about:blank';
            }
            
            if (UI.video) {
                UI.video.style.display = 'block';
                UI.video.style.opacity = '1';
                UI.video.style.visibility = 'visible';
            }
            
            await player.load(streamUrl);
            
            try {
                await UI.video.play();
            } catch (playError) {
                console.log('Autoplay blocked:', playError.message);
            }
            
            console.log('✅ Shaka playback successful');
            Performance.end('ShakaTry');
            return { success: true, player: 'shaka' };
            
        } catch (error) {
            console.error('❌ Shaka failed:', error);
            Performance.end('ShakaTry');
            
            if (shakaPlayerInstance) {
                try {
                    await shakaPlayerInstance.destroy();
                } catch (e) {}
                shakaPlayerInstance = null;
            }
            
            return { success: false, error: error.message };
        }
    },
    
    async tryHlsJsPlayer(videoElement, streamUrl, channel) {
        Performance.start('HlsJsTry');
        
        try {
            const player = await initHlsJsPlayer(videoElement, streamUrl, channel);
            if (!player) {
                throw new Error('HLS.js init failed');
            }
            
            if (UI.frame) {
                UI.frame.style.display = 'none';
                UI.frame.src = 'about:blank';
            }
            
            if (UI.video) {
                UI.video.style.display = 'block';
                UI.video.style.opacity = '1';
                UI.video.style.visibility = 'visible';
            }
            
            await new Promise((resolve, reject) => {
                const timeout = setTimeout(() => {
                    reject(new Error('HLS.js load timeout'));
                }, 10000);
                
                hlsPlayerInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    clearTimeout(timeout);
                    resolve();
                });
            });
            
            try {
                await UI.video.play();
            } catch (playError) {
                console.log('Autoplay blocked:', playError.message);
            }
            
            console.log('✅ HLS.js playback successful');
            Performance.end('HlsJsTry');
            return { success: true, player: 'hlsjs' };
            
        } catch (error) {
            console.error('❌ HLS.js failed:', error);
            Performance.end('HlsJsTry');
            
            if (hlsPlayerInstance) {
                try {
                    hlsPlayerInstance.destroy();
                } catch (e) {}
                hlsPlayerInstance = null;
            }
            
            return { success: false, error: error.message };
        }
    },
    
    async useIframe(streamUrl, channel) {
        Performance.start('IframeTry');
        
        this.cleanupAllPlayers();
        
        if (UI.video) {
            UI.video.style.display = 'none';
            UI.video.style.opacity = '0';
            UI.video.style.visibility = 'hidden';
        }
        
        if (UI.frame) {
            UI.frame.style.display = 'block';
            UI.frame.src = streamUrl;
            
            console.log('✅ Iframe playback started');
            Performance.end('IframeTry');
            return { success: true, player: 'iframe' };
        }
        
        Performance.end('IframeTry');
        return { success: false, error: 'Iframe not available' };
    },
    
    cleanupAllPlayers() {
        if (shakaPlayerInstance) {
            try {
                shakaPlayerInstance.destroy();
            } catch (e) {}
            shakaPlayerInstance = null;
        }
        
        if (hlsPlayerInstance) {
            try {
                hlsPlayerInstance.destroy();
            } catch (e) {}
            hlsPlayerInstance = null;
        }
        
        if (UI.video) {
            UI.video.style.display = 'none';
            UI.video.pause();
            UI.video.src = '';
            UI.video.style.opacity = '0';
            UI.video.style.visibility = 'hidden';
        }
        
        if (UI.frame) {
            UI.frame.src = 'about:blank';
        }
    }
};

    UI.errorBg = document.getElementById('error-background');

    UI.btnNext = document.getElementById('btn-next');

    UI.initStatus = document.getElementById('init-status');
    
    setupEventListeners();

function setupEventListeners() {
    if (UI.touchOverlay) {
        UI.touchOverlay.addEventListener('click', () => {
            showSidebar();
            hideOSD();
        });
    }
    
    if (UI.btnPrev) {
        UI.btnPrev.addEventListener('click', () => {
            if (State.currentIndex > 0) {
                playChannel(State.currentIndex - 1, false);
                hideSidebar();
            }
        });
    }
    
    if (UI.btnNext) {
        UI.btnNext.addEventListener('click', () => {
            if (State.currentIndex < State.rawChannels.length - 1) {
                playChannel(State.currentIndex + 1, false);
                hideSidebar();
            }
        });
    }
    
    if (UI.sidebarQualityBtn) {
        UI.sidebarQualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleQualitySelector();
        });
    }
    
    if (UI.qualitySelector) {
        const qualityBtns = UI.qualitySelector.querySelectorAll('.quality-btn');
        qualityBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const quality = e.target.getAttribute('data-quality');
                if (quality && QualityManager) {
                    QualityManager.setQuality(quality);
                }
            });
        });
    }
    
    if (UI.listBtn1) {
        UI.listBtn1.addEventListener('click', () => {
            loadChannelList('channels.js');
        });
    }
    
    if (UI.listBtn2) {
        UI.listBtn2.addEventListener('click', () => {
            loadChannelList('ch2.js');
        });
    }
    
    document.addEventListener('keydown', (e) => {
        switch(e.key) {
            case 'ArrowLeft':
                e.preventDefault();
                if (State.currentIndex > 0) {
                    playChannel(State.currentIndex - 1, false);
                }
                break;
            case 'ArrowRight':
                e.preventDefault();
                if (State.currentIndex < State.rawChannels.length - 1) {
                    playChannel(State.currentIndex + 1, false);
                }
                break;
            case ' ':
            case 'Enter':
                e.preventDefault();
                if (State.appStarted) {
                    toggleSidebar();
                }
                break;
            case 'Escape':
                e.preventDefault();
                hideSidebar();
                hideQualitySelector();
                break;
            case 'q':
            case 'Q':
                e.preventDefault();
                toggleQualitySelector();
                break;
        }
    });
}

function showSidebar() {
    if (UI.sidebar) {
        UI.sidebar.classList.add('active');
        State.sidebarVisible = true;
        
        clearTimeout(State.timers.sidebar);
        State.timers.sidebar = setTimeout(() => {
            hideSidebar();
        }, CONFIG.SIDEBAR_TIMEOUT_MS);
    }
}

function hideSidebar() {
    if (UI.sidebar) {
        UI.sidebar.classList.remove('active');
        State.sidebarVisible = false;
    }
}

function toggleSidebar() {
    if (State.sidebarVisible) {
        hideSidebar();
    } else {
        showSidebar();
    }
}

function showOSD(text) {
    if (UI.osd) {
        UI.osd.innerHTML = text;
        UI.osd.style.display = 'block';
        
        clearTimeout(State.timers.osd);
        State.timers.osd = setTimeout(() => {
            hideOSD();
        }, CONFIG.OSD_TIMEOUT_MS);
    }
}

function hideOSD() {
    if (UI.osd) {
        UI.osd.style.display = 'none';
    }
}

function toggleQualitySelector() {
    if (UI.qualitySelector) {
        if (UI.qualitySelector.style.display === 'flex') {
            hideQualitySelector();
        } else {
            showQualitySelector();
        }
    }
}

function showQualitySelector() {
    if (UI.qualitySelector) {
        UI.qualitySelector.style.display = 'flex';
        
        const qualityBtns = UI.qualitySelector.querySelectorAll('.quality-btn');
        qualityBtns.forEach(btn => {
            const quality = btn.getAttribute('data-quality');
            if (quality === State.currentQuality) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
}

function hideQualitySelector() {
    if (UI.qualitySelector) {
        UI.qualitySelector.style.display = 'none';
    }
}

function hideLoading() {
    if (UI.loader) {
        UI.loader.style.display = 'none';
    }
    clearTimeout(State.timers.loader);
}

function onStreamSuccess() {
    hideLoading();
    if (UI.errorBg) {
        UI.errorBg.style.display = 'none';
    }
    hideSidebar();
}

function onStreamError(message) {
    showError(message || 'Stream error');
    hideLoading();
}

function showError(channelName) {
    console.error('❌ Error loading channel:', channelName);
    
    if (State.timers.loader) {
        clearTimeout(State.timers.loader);
        State.timers.loader = null;
    }
    if (State.timers.error) {
        clearTimeout(State.timers.error);
        State.timers.error = null;
    }
    
    if (UI.loader) {
        UI.loader.style.display = 'none';
    }
    
    if (UI.frame) {
        UI.frame.src = 'about:blank';
        UI.frame.style.display = 'none'; 
    }
    
    if (UI.video) { 
        UI.video.pause();
        UI.video.src = '';
        UI.video.style.display = 'none';
        UI.video.style.opacity = '0'; 
        UI.video.style.visibility = 'hidden'; 
    }
    
    PlayerManager.cleanupAllPlayers();

    if (UI.errorBg) {
        UI.errorBg.style.display = 'block';
        UI.errorBg.style.zIndex = '900'; 
    }

    const errorMessage = `
        <span style="color: #FF0000; font-weight: bold;">[ERROR]</span><br>
        Could not load channel: <b>${channelName}</b>.<br>
        Please try another channel or check your network.<br>
        <span style="color:gold; font-size:12px; margin-top:5px; display:block;">
            Tip: Press 
            <span style="font-size: 16px; margin: 0 5px; border: 1px solid gold; padding: 2px 5px; border-radius: 4px;">&larr;</span> 
            / 
            <span style="font-size: 16px; margin: 0 5px; border: 1px solid gold; padding: 2px 5px; border-radius: 4px;">&rarr;</span> 
            on your remote to switch channel lists.
        </span>
    `;
    
    if (UI.osd) {
        UI.osd.innerHTML = errorMessage;
        UI.osd.style.display = 'block';
        
        State.timers.error = setTimeout(() => {
            if (UI.osd) UI.osd.style.display = 'none';
        }, 10000);
    }
    
    // Auto-retry after 5 seconds
    if (State.timers.retry) clearTimeout(State.timers.retry);
    State.timers.retry = setTimeout(() => {
        if (State.rawChannels.length > 0) {
            console.log('🔄 Auto-retrying channel...');
            playChannel(State.currentIndex, false);
        }
    }, 5000);
}

function startApp() {
    if (State.appStarted) return;
    
    State.appStarted = true;
    console.log('🚀 Starting app...');
    
    // Load saved quality preference
    const savedQuality = State.load('preferred_quality');
    if (savedQuality && CONFIG.QUALITY_LEVELS.includes(savedQuality)) {
        QualityManager.setQuality(savedQuality);
    } else {
        QualityManager.setQuality(CONFIG.DEFAULT_QUALITY);
    }
    
    if (CONFIG.NETWORK_MONITORING) {
        NetworkMonitor.init();
    }
    
    loadChannelList(CONFIG.INITIAL_LIST_FILE);
}

// CHANNEL LOADER

async function loadChannelList(listFile) {
    console.log(`📋 Loading channel list: ${listFile}`);
    
    if (!listFile || !CONFIG.AVAILABLE_LISTS.includes(listFile)) {
        console.error('Invalid list file:', listFile);
        return;
    }
    
    showLoading('Loading channels...');
    
    try {
        let channels = [];
        
        if (window.location.protocol === 'file:') {
            channels = await loadChannelsViaScript(listFile);
        } else {
            const response = await fetch(listFile);
            if (!response.ok) {
                throw new Error(`Failed to load ${listFile}: ${response.status}`);
            }
            
            const scriptContent = await response.text();
            channels = parseChannelData(scriptContent, listFile);
        }
        
        if (!Array.isArray(channels)) {
            throw new Error(`Invalid data format in ${listFile}`);
        }
        
        State.rawChannels = channels;
        State.currentListFile = listFile;
        
        renderChannelList();
        
        if (UI.listBtn1) UI.listBtn1.classList.remove('active');
        if (UI.listBtn2) UI.listBtn2.classList.remove('active');
        
        if (listFile === 'channels.js') {
            if (UI.listBtn1) UI.listBtn1.classList.add('active');
        } else if (listFile === 'ch2.js') {
            if (UI.listBtn2) UI.listBtn2.classList.add('active');
        }
        
        const lastIndex = parseInt(State.load(`last_channel_${listFile}`)) || 0;
        if (State.rawChannels.length > 0) {
            playChannel(lastIndex, false);
        } else {
            hideLoading();
            showError('No channels in list');
        }
        
    } catch (error) {
        console.error('Failed to load channel list:', error);
        showError(`Failed to load channels: ${error.message}`);
    }
}

function loadChannelsViaScript(listFile) {
    return new Promise((resolve, reject) => {
        if (listFile === 'ch2.js' && window.rawChannels2) {
            const channels = window.rawChannels2.map(ch => ({
                category: ch.group,
                name: ch.name,
                logo: ch.logo,
                url: ch.stream
            }));
            return resolve(channels);
        }
        
        if (listFile === 'channels.js' && window.rawChannels) {
            const channels = window.rawChannels.map(ch => ({
                category: ch.group,
                name: ch.name,
                logo: ch.logo,
                url: ch.stream
            }));
            return resolve(channels);
        }
        
        const script = document.createElement('script');
        script.src = listFile;
        
        script.onload = () => {
            setTimeout(() => {
                let channels = [];
                
                if (listFile === 'ch2.js' && window.rawChannels2) {
                    channels = window.rawChannels2.map(ch => ({
                        category: ch.group,
                        name: ch.name,
                        logo: ch.logo,
                        url: ch.stream
                    }));
                } else if (listFile === 'channels.js' && window.rawChannels) {
                    channels = window.rawChannels.map(ch => ({
                        category: ch.group,
                        name: ch.name,
                        logo: ch.logo,
                        url: ch.stream
                    }));
                }
                
                if (channels.length > 0) {
                    resolve(channels);
                } else {
                    reject(new Error('No channels found'));
                }
            }, 100);
        };
        
        script.onerror = () => reject(new Error(`Failed to load ${listFile}`));
        document.head.appendChild(script);
    });
}

function parseChannelData(scriptContent, listFile) {
    let channels = [];
    
    try {
        let arrayStr = '';
        
        if (listFile === 'ch2.js') {
            const match = scriptContent.match(/window\.rawChannels2\s*=\s*(\[[\s\S]*?\])\s*;/);
            if (match) arrayStr = match[1];
        } else if (listFile === 'channels.js') {
            const match = scriptContent.match(/window\.rawChannels\s*=\s*(\[[\s\S]*?\])\s*;/);
            if (match) arrayStr = match[1];
        }
        
        if (arrayStr) {
            const cleanStr = arrayStr
                .replace(/\s*\/\/.*$/gm, '')
                .replace(/,\s*]/g, ']')
                .trim();
            
            try {
                const parsed = JSON.parse(cleanStr);
                channels = parsed.map(ch => ({
                    category: ch.group,
                    name: ch.name,
                    logo: ch.logo,
                    url: ch.stream
                }));
            } catch (jsonError) {
                const parsed = eval(`(${cleanStr})`);
                channels = parsed.map(ch => ({
                    category: ch.group,
                    name: ch.name,
                    logo: ch.logo,
                    url: ch.stream
                }));
            }
        }
    } catch (error) {
        console.error('Parse error:', error);
        throw new Error(`Failed to parse ${listFile}`);
    }
    
    return channels;
}

function renderChannelList() {
    if (!UI.channelList || !State.rawChannels.length) return;
    
    UI.channelList.innerHTML = '';
    
    const channelsByCategory = {};
    State.rawChannels.forEach((channel, index) => {
        const category = channel.category || 'General';
        if (!channelsByCategory[category]) {
            channelsByCategory[category] = [];
        }
        channelsByCategory[category].push({ ...channel, index });
    });
    
    for (const category in channelsByCategory) {
        const categoryTitle = document.createElement('li');
        categoryTitle.className = 'category-title';
        categoryTitle.textContent = category.toUpperCase();
        UI.channelList.appendChild(categoryTitle);
        
        channelsByCategory[category].forEach(channelData => {
            const channelItem = createChannelElement(channelData, channelData.index);
            UI.channelList.appendChild(channelItem);
        });
    }
    
    updateMobileLogos();
}

function createChannelElement(channel, index) {
    const li = document.createElement('li');
    li.id = `ch-${index}`;
    li.className = 'channel-item';
    if (index === State.currentIndex) {
        li.classList.add('selected');
    }
    
    const img = document.createElement('img');
    img.src = ImageHelper.getLogo(channel);
    img.alt = channel.name;
    img.loading = 'lazy';
    
    const nameSpan = document.createElement('span');
    nameSpan.className = 'channel-name';
    nameSpan.textContent = channel.name;
    
    li.appendChild(img);
    li.appendChild(nameSpan);
    
    li.addEventListener('click', () => {
        playChannel(index, false);
        hideSidebar();
    });
    
    return li;
}

function updateMobileLogos() {
    if (!State.rawChannels.length) return;
    
    if (State.currentIndex > 0 && UI.btnPrevImg) {
        const prevChannel = State.rawChannels[State.currentIndex - 1];
        UI.btnPrevImg.src = ImageHelper.getLogo(prevChannel);
        UI.btnPrevImg.alt = `Previous: ${prevChannel.name}`;
    }
    
    if (State.currentIndex < State.rawChannels.length - 1 && UI.btnNextImg) {
        const nextChannel = State.rawChannels[State.currentIndex + 1];
        UI.btnNextImg.src = ImageHelper.getLogo(nextChannel);
        UI.btnNextImg.alt = `Next: ${nextChannel.name}`;
    }
}

function getChannelUrl(channel) {
    if (!channel) return '';
    return channel.url || channel.stream || '';
}

// ============================================
// MAIN PLAY CHANNEL FUNCTION - SIMPLIFIED
// ============================================
async function playChannel(index, showSidebarAfter = false) {
    if (!State.rawChannels.length) {
        showError('No channels available');
        return;
    }
    
    index = Math.max(0, Math.min(index, State.rawChannels.length - 1));
    State.currentIndex = index;
    
    State.save(`last_channel_${State.currentListFile}`, index.toString());
    
    const channel = State.rawChannels[index];
    if (!channel) {
        showError('Channel not found');
        return;
    }
    
    const streamUrl = getChannelUrl(channel);
    if (!streamUrl) {
        showError(`No stream URL for ${channel.name}`);
        return;
    }
    
    showLoading(`Loading ${channel.name}...`, channel);
    
    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('selected'));
    const selectedEl = document.getElementById(`ch-${index}`);
    if (selectedEl) selectedEl.classList.add('selected');
    
    if (UI.errorBg) {
        UI.errorBg.style.display = 'none';
    }
    
    try {
        // Use the simplified player manager
        const result = await PlayerManager.loadStream(UI.video, streamUrl, channel, State.currentListFile);
        
        if (result.success) {
            const playerName = result.player.toUpperCase();
            showOSD(`${channel.name} - ${playerName} (${State.currentQuality === 'auto' ? 'Auto' : State.currentQuality + 'p'})`);
            
            onStreamSuccess();
            console.log(`✅ Using ${playerName} player for ${channel.name}`);
            updateMobileLogos();
            QualityManager.autoAdjust();
        } else {
            console.error('Playback failed:', result.error);
            showError(channel.name);
        }
        
    } catch (error) {
        console.error('Playback failed:', error);
        showError(channel.name);
    }
    
    if (showSidebarAfter) {
        showSidebar();
    }
}

// ============================================
// LOADING FUNCTION
// ============================================
function showLoading(message = 'Loading...', channel = null) {
    if (UI.loader) {
        UI.loader.style.display = 'flex';
        
        if (UI.loadingMsg) {
            UI.loadingMsg.textContent = message;
        }
        
        if (channel && UI.loadingImg) {
            const logo = ImageHelper.getLogo(channel);
            UI.loadingImg.src = logo;
            UI.loadingImg.alt = channel.name;
        }
        
        if (UI.loadingDetails) {
            const speedElement = document.getElementById('detected-speed');
            const qualityElement = document.getElementById('loading-quality');
            const playerElement = document.getElementById('loading-player');
            
            if (speedElement) {
                speedElement.textContent = State.connectionSpeed > 0 ? 
                    `${State.connectionSpeed.toFixed(1)}Mbps (${State.networkQuality})` : 'Checking...';
            }
            
            if (qualityElement) {
                qualityElement.textContent = State.currentQuality === 'auto' ? 'Auto' : State.currentQuality + 'p';
            }
            
            if (playerElement && channel) {
                const streamUrl = getChannelUrl(channel);
                const playerType = detectBestPlayerForStream(streamUrl);
                playerElement.textContent = playerType.toUpperCase();
                playerElement.style.color = 
                    playerType === 'shaka' ? '#4CAF50' : 
                    playerType === 'hlsjs' ? '#2196F3' : '#FF9800';
            }
        }
    }
    
    if (State.timers.loader) clearTimeout(State.timers.loader);
    State.timers.loader = setTimeout(() => {
        console.log('⏱️ Loading timeout (15s)');
        hideLoading();
    }, 15000);
}

// ============================================
// INITIALIZATION - LOAD PLAYERS FIRST
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    console.log('🚀 Initializing Live TV...');
    
    // Setup controls first
    setupControls();
    
    // Show initial loading screen
    InitialLoader.updateProgress(0, 'Starting...');
    
    // Load players in parallel with progress tracking
    console.log('📥 Loading players first...');
    
    Promise.all([
        ShakaLoader.load(),
        HlsJsLoader.load()
    ]).then(([shakaLoaded, hlsLoaded]) => {
        console.log(`Players loaded: Shaka=${shakaLoaded}, HLS.js=${hlsLoaded}`);
        
        // Complete initial loading
        setTimeout(() => {
            InitialLoader.complete();
        }, 500);
        
    }).catch(error => {
        console.error('Player loading error:', error);
        // Still continue even if players fail
        setTimeout(() => {
            InitialLoader.complete();
        }, 500);
    });
    
    // Hide notice bar after 2 cycles
    const marquee = document.getElementById('marquee-text');
    if (marquee) {
        let cycles = 0;
        marquee.addEventListener('animationiteration', () => {
            cycles++;
            if (cycles >= 2 && UI.noticeBar) {
                UI.noticeBar.style.display = 'none';
            }
        });
    }
    
    console.log('✅ Setup started - Loading players first...');
});

// ============================================
// NETWORK MONITOR
// ============================================
const NetworkMonitor = {
    init: function() {
        if (!CONFIG.NETWORK_MONITORING) return;
        
        console.log('🌐 Initializing network monitor...');
        
        if ('connection' in navigator) {
            const conn = navigator.connection;
            if (conn) {
                conn.addEventListener('change', () => {
                    this.checkNetwork();
                });
                console.log('✅ Network Information API available');
            }
        } else {
            console.log('⚠️ Network Information API not available');
        }
        
        this.checkNetwork();
        setInterval(() => this.checkNetwork(), 15000);
    },
    
    checkNetwork: function() {
        if ('connection' in navigator) {
            const conn = navigator.connection;
            if (conn) {
                State.connectionSpeed = conn.downlink || 0;
                State.networkQuality = this.getNetworkQuality(conn.effectiveType);
                this.updateNetworkUI();
                console.log(`📶 Network: ${State.connectionSpeed.toFixed(1)}Mbps (${State.networkQuality})`);
                
                if (CONFIG.ENABLE_LOW_NETWORK_MODE) {
                    this.autoAdjustQuality();
                }
            }
        } else {
            // More realistic fallback simulation
            State.connectionSpeed = this.simulateNetworkSpeed();
            State.networkQuality = State.connectionSpeed > 8 ? 'good' : State.connectionSpeed > 3 ? 'fair' : 'poor';
            this.updateNetworkUI();
        }
    },
    
    simulateNetworkSpeed: function() {
        const speeds = [0.5, 1, 2, 3, 5, 8, 12, 20, 30, 50];
        return speeds[Math.floor(Math.random() * speeds.length)];
    },
    
    getNetworkQuality: function(effectiveType) {
        if (!effectiveType) return 'unknown';
        switch(effectiveType) {
            case '4g':
            case 'wifi': return 'good';
            case '3g': return 'fair';
            case '2g':
            case 'slow-2g': return 'poor';
            default: return 'unknown';
        }
    },
    
    updateNetworkUI: function() {
        const statusEl = document.getElementById('network-status');
        if (statusEl) {
            statusEl.style.display = 'block';
            statusEl.className = `network-${State.networkQuality}`;
            
            const icon = document.getElementById('network-icon');
            const text = document.getElementById('network-text');
            
            if (icon && text) {
                icon.textContent = '📶';
                text.textContent = `${State.connectionSpeed.toFixed(1)}Mbps`;
            }
        }
    },
    
    autoAdjustQuality: function() {
        if (State.currentQuality !== 'auto') return;
        if (State.networkQuality === 'poor' && State.currentQuality !== '360') {
            QualityManager.setQuality('360');
        } else if (State.networkQuality === 'fair' && State.currentQuality !== '480') {
            QualityManager.setQuality('480');
        }
    }
};

// ============================================
// QUALITY MANAGER
// ============================================
const QualityManager = {
    setQuality: function(quality) {
        if (!CONFIG.QUALITY_LEVELS.includes(quality)) {
            console.error('Invalid quality:', quality);
            return;
        }
        
        State.currentQuality = quality;
        State.save('preferred_quality', quality);
        
        if (UI.currentQualityDisplay) {
            UI.currentQualityDisplay.textContent = quality === 'auto' ? 'Auto' : `${quality}p`;
        }
        
        if (UI.qualitySelector) {
            const qualityBtns = UI.qualitySelector.querySelectorAll('.quality-btn');
            qualityBtns.forEach(btn => {
                const btnQuality = btn.getAttribute('data-quality');
                if (btnQuality === quality) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        if (State.appStarted && State.rawChannels[State.currentIndex]) {
            showOSD(`Quality set to: ${quality === 'auto' ? 'Auto' : quality + 'p'}`);
            setTimeout(() => {
                playChannel(State.currentIndex, false);
            }, 1000);
        }
        
        hideQualitySelector();
    },
    
    autoAdjust: function() {
        if (State.currentQuality !== 'auto') return;
        if (State.networkQuality === 'poor') {
            this.setQuality('360');
        } else if (State.networkQuality === 'fair') {
            this.setQuality('480');
        }
    }
};

// ============================================
// CLEANUP
// ============================================
window.addEventListener('beforeunload', () => {
    State.clearTimers();
    PlayerManager.cleanupAllPlayers();
});
</script>
